        td { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; font-size: 14px; }
        td:first-child { color: #555; width: 40%; }
        td:last-child { color: #222; border-right: none; }
        tr:last-child td { border-bottom: none; }
    </style>
